apiVersion: v1
kind: Service
metadata: {name: radicale}
spec:
  selector: {app: foyer-radicale}
  ports: [{port: 5232}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: radicale}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: radicale}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: foyer-radicale}
  template:
    metadata:
      labels: {app: foyer-radicale}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: radicale
          image: ghcr.io/amoghsolomon/foyer:radicale-main
          env: [{name: PYTHONDONTWRITEBYTECODE, value: '1'}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 5232}
          volumeMounts:
            - {name: data, mountPath: /var/lib/radicale}
            - {name: auth, mountPath: /run/secrets/foyer, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: radicale}}
        - name: auth
          secret:
            secretName: foyer-dav
            items: [{key: radicale-users, path: radicale-users}]
        - {name: tmp, emptyDir: {}}
