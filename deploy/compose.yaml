name: foyer

services:
  proxy:
    image: caddy:2.10.2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      FOYER_DOMAIN: ${FOYER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: services/server/Dockerfile
    restart: unless-stopped
    environment:
      FOYER_SERVER_BIND: 0.0.0.0:3583
      FOYER_SERVER_HEALTH_ADDR: 127.0.0.1:3583
      FOYER_DATABASE_URL: postgres://${POSTGRES_USER:-foyer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DATABASE:-foyer}
      FOYER_SERVER_ENV: ${FOYER_SERVER_ENV:-development}
      FOYER_DEV_USER_ID: ${FOYER_DEV_USER_ID:-}
      FOYER_DEV_TOKEN: ${FOYER_DEV_TOKEN:-}
      FOYER_DEV_EXTRA_USERS: ${FOYER_DEV_EXTRA_USERS:-}
      FOYER_AUTH_SIGNING_KEY_PATH: ${FOYER_AUTH_SIGNING_KEY_PATH:-}
      FOYER_AUTH_KEY_ID: ${FOYER_AUTH_KEY_ID:-foyer-dev}
      FOYER_AUTH_ISSUER: ${FOYER_AUTH_ISSUER:-foyer-server}
      FOYER_AUTH_API_AUDIENCE: ${FOYER_AUTH_API_AUDIENCE:-foyer-api}
      FOYER_POWERSYNC_URL: ${FOYER_POWERSYNC_URL:-http://127.0.0.1:8080}
      FOYER_POWERSYNC_AUDIENCE: ${FOYER_POWERSYNC_AUDIENCE:-foyer-powersync}
      FOYER_DAV_URL: ${FOYER_DAV_URL:-http://radicale:5232}
      FOYER_DAV_USERNAME: ${FOYER_DAV_USERNAME:-foyer}
      FOYER_DAV_PASSWORD: ${FOYER_DAV_PASSWORD:?set FOYER_DAV_PASSWORD in deploy/.env}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${FOYER_SECRETS_DIR:-./secrets}:/run/secrets/foyer:ro
    ports:
      - "127.0.0.1:3583:3583"
    depends_on:
      postgres:
        condition: service_healthy
      radicale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "foyer-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-foyer}
      POSTGRES_USER: ${POSTGRES_USER:-foyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POWERSYNC_REPLICATION_PASSWORD: ${POWERSYNC_REPLICATION_PASSWORD:?set POWERSYNC_REPLICATION_PASSWORD in deploy/.env}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?set POWERSYNC_STORAGE_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  powersync:
    image: journeyapps/powersync-service:1.23.3
    restart: unless-stopped
    command: ["start"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      PS_SOURCE_DATABASE: ${POSTGRES_DATABASE:-foyer}
      PS_SOURCE_PASSWORD: ${POWERSYNC_REPLICATION_PASSWORD:?set POWERSYNC_REPLICATION_PASSWORD in deploy/.env}
      PS_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?set POWERSYNC_STORAGE_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./powersync/config.yaml:/config/config.yaml:ro
      - ./powersync/sync.yaml:/config/sync.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/probes/liveness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s

  # Official Kozea Radicale. Development publishes loopback 5232 and mounts
  # users.dev. Production must override the htpasswd file and omit the port.
  radicale:
    image: kozea/radicale:3.7.3
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - ./radicale/config:/etc/radicale/config:ro
      - ./radicale/rights:/etc/radicale/rights:ro
      - ${RADICALE_HTPASSWD_FILE:-./radicale/users.dev}:/etc/radicale/users:ro
      - radicale_data:/var/lib/radicale
    ports:
      - "127.0.0.1:5232:5232"
    healthcheck:
      test:
        [
          "CMD",
          "/app/bin/python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',5232),2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Standalone backup/restore image. Invoked by deploy/backup/scripts/host.sh.
  # Never started with the default stack and never given a Docker socket.
  backup:
    profiles: ["backup"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: "no"
    init: true
    environment:
      FOYER_BACKUP_POSTGRES_HOST: postgres
      FOYER_BACKUP_POSTGRES_PORT: "5432"
      FOYER_BACKUP_POSTGRES_DB: ${POSTGRES_DATABASE:-foyer}
      FOYER_BACKUP_POSTGRES_USER: ${POSTGRES_USER:-foyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      FOYER_BACKUP_S3_ENDPOINT: ${FOYER_BACKUP_S3_ENDPOINT:-http://minio:9000}
      FOYER_BACKUP_S3_REGION: ${FOYER_BACKUP_S3_REGION:-us-east-1}
      FOYER_BACKUP_S3_BUCKET: ${FOYER_BACKUP_S3_BUCKET:-foyer-backups}
      FOYER_BACKUP_S3_PREFIX: ${FOYER_BACKUP_S3_PREFIX:-foyer/}
      FOYER_BACKUP_S3_ACCESS_KEY: ${FOYER_BACKUP_S3_ACCESS_KEY:-${FOYER_BACKUP_TEST_MINIO_USER:-foyer-backup-test}}
      FOYER_BACKUP_S3_SECRET_KEY: ${FOYER_BACKUP_S3_SECRET_KEY:-${FOYER_BACKUP_TEST_MINIO_PASSWORD:-foyer-backup-test-minio-password}}
      FOYER_BACKUP_S3_SESSION_TOKEN: ${FOYER_BACKUP_S3_SESSION_TOKEN:-}
      FOYER_BACKUP_S3_ADDRESSING: ${FOYER_BACKUP_S3_ADDRESSING:-path}
      FOYER_RADICALE_IMAGE: kozea/radicale:3.7.3
    volumes:
      - radicale_data:/var/lib/radicale:ro
    tmpfs:
      - /tmp:mode=0700
    working_dir: /backup
    security_opt:
      - no-new-privileges:true

  minio:
    profiles: ["backup-test"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FOYER_BACKUP_TEST_MINIO_USER:-foyer-backup-test}
      MINIO_ROOT_PASSWORD: ${FOYER_BACKUP_TEST_MINIO_PASSWORD:-foyer-backup-test-minio-password}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - backup_test_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    profiles: ["backup-test"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      FOYER_BACKUP_S3_ENDPOINT: http://minio:9000
      FOYER_BACKUP_S3_REGION: ${FOYER_BACKUP_S3_REGION:-us-east-1}
      FOYER_BACKUP_S3_BUCKET: ${FOYER_BACKUP_S3_BUCKET:-foyer-backups}
      FOYER_BACKUP_S3_PREFIX: ${FOYER_BACKUP_S3_PREFIX:-foyer/}
      FOYER_BACKUP_S3_ACCESS_KEY: ${FOYER_BACKUP_TEST_MINIO_USER:-foyer-backup-test}
      FOYER_BACKUP_S3_SECRET_KEY: ${FOYER_BACKUP_TEST_MINIO_PASSWORD:-foyer-backup-test-minio-password}
      FOYER_BACKUP_S3_ADDRESSING: path
    command: ["ensure-bucket"]

  restore-test-postgres:
    profiles: ["backup-test"]
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-foyer}
      POSTGRES_USER: ${POSTGRES_USER:-foyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - restore_test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  restore-test-radicale:
    profiles: ["backup-test"]
    image: kozea/radicale:3.7.3
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - ./radicale/config:/etc/radicale/config:ro
      - ./radicale/rights:/etc/radicale/rights:ro
      - ${RADICALE_HTPASSWD_FILE:-./radicale/users.dev}:/etc/radicale/users:ro
      - restore_test_radicale_data:/var/lib/radicale
    ports:
      - "127.0.0.1:15232:5232"
    healthcheck:
      test:
        [
          "CMD",
          "/app/bin/python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',5232),2); s.close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  restore-test-server:
    profiles: ["backup-test"]
    image: foyer-server
    build:
      context: ..
      dockerfile: services/server/Dockerfile
    restart: unless-stopped
    environment:
      FOYER_SERVER_BIND: 0.0.0.0:3583
      FOYER_SERVER_HEALTH_ADDR: 127.0.0.1:3583
      FOYER_DATABASE_URL: postgres://${POSTGRES_USER:-foyer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@restore-test-postgres:5432/${POSTGRES_DATABASE:-foyer}
      FOYER_SERVER_ENV: ${FOYER_SERVER_ENV:-development}
      FOYER_DEV_USER_ID: ${FOYER_DEV_USER_ID:-}
      FOYER_DEV_TOKEN: ${FOYER_DEV_TOKEN:-}
      FOYER_DEV_EXTRA_USERS: ${FOYER_DEV_EXTRA_USERS:-}
      FOYER_AUTH_SIGNING_KEY_PATH: ${FOYER_AUTH_SIGNING_KEY_PATH:-}
      FOYER_AUTH_KEY_ID: ${FOYER_AUTH_KEY_ID:-foyer-dev}
      FOYER_AUTH_ISSUER: ${FOYER_AUTH_ISSUER:-foyer-server}
      FOYER_AUTH_API_AUDIENCE: ${FOYER_AUTH_API_AUDIENCE:-foyer-api}
      FOYER_POWERSYNC_URL: ${FOYER_POWERSYNC_URL:-http://127.0.0.1:8080}
      FOYER_POWERSYNC_AUDIENCE: ${FOYER_POWERSYNC_AUDIENCE:-foyer-powersync}
      FOYER_DAV_URL: http://restore-test-radicale:5232
      FOYER_DAV_USERNAME: ${FOYER_DAV_USERNAME:-foyer}
      FOYER_DAV_PASSWORD: ${FOYER_DAV_PASSWORD:?set FOYER_DAV_PASSWORD in deploy/.env}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ${FOYER_SECRETS_DIR:-./secrets}:/run/secrets/foyer:ro
    ports:
      - "127.0.0.1:13583:3583"
    depends_on:
      restore-test-postgres:
        condition: service_healthy
      restore-test-radicale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "foyer-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  caddy_config:
  caddy_data:
  postgres_data:
  radicale_data:
  backup_test_minio_data:
  restore_test_postgres_data:
  restore_test_radicale_data:
