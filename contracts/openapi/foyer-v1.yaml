openapi: 3.1.0
info:
  title: Foyer Server API
  version: 0.4.0
  description: |
    Contract for the self-hosted Foyer Rust service.

    This version covers notes, bookmarks, tasks, contacts, calendar, and device-key
    authentication. Clients communicate only through this contract and
    `contracts/auth/v1/`. They do not receive PostgreSQL credentials, DAV
    credentials, raw iCalendar/vCard payloads, or operation/checkpoint tables.

    Calendar, tasks, and contacts are normalized projections of Radicale. Notes and
    bookmarks are PostgreSQL-canonical. All mutations use client-generated operation
    identifiers. DAV-backed writes also carry the last observed ETag or revision.

    The deleted Cloudflare/Flue HTTP API is not a compatibility target.

    ## Authentication

    Production identity is a manually enrolled ECDSA P-256 device key (ADR 0023).

    - `POST /v1/auth/challenges` with `{ "deviceKeyId": "<thumbprint>" }`.
    - Sign the opaque `signingPayload` bytes with ECDSA P-256/SHA-256.
    - `POST /v1/auth/sessions` with `{ "challengeId", "signature" }` where the
      signature is IEEE P1363 `r||s`, base64url without padding.
    - Send `Authorization: Bearer <accessToken>` on every authenticated route.
    - `GET /v1/auth/jwks` publishes the server ES256 verification key.
    - `GET /v1/sync/credentials` issues a five-minute PowerSync JWT with a
      distinct audience. PowerSync verifies only the public JWKS.

    Field names, thumbprint construction, payload domain separation, and
    cross-language fixtures live in `contracts/auth/v1/`.

    The static development bearer token remains available only when
    `FOYER_SERVER_ENV=development`. Production refuses to start without a valid
    PEM signing key and rejects the static token.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the server process is alive
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the server can serve notes traffic
      security: []
      responses:
        "200":
          description: The process is alive and PostgreSQL accepted a ping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/auth/challenges:
    post:
      operationId: createAuthChallenge
      summary: Issue a one-shot device signing challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthChallengeRequest"
      responses:
        "200":
          description: Challenge identifier, opaque signing payload, and expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallenge"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/sessions:
    post:
      operationId: createAuthSession
      summary: Consume a challenge and issue a Foyer access JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthSessionRequest"
      responses:
        "200":
          description: A five-minute ES256 access token for the enrolled device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/auth/jwks:
    get:
      operationId: getAuthJwks
      summary: Publish the server ES256 verification JWKS
      security: []
      responses:
        "200":
          description: Public JWKS used by Foyer Server and PowerSync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
  /v1/session:
    get:
      operationId: getSession
      summary: Return the authenticated principal
      responses:
        "200":
          description: The access token or development bearer is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sync/credentials:
    get:
      operationId: getSyncCredentials
      summary: Issue a short-lived PowerSync JWT
      description: |
        Returns a five-minute ES256 JWT and the client-facing PowerSync URL. The
        token uses a distinct audience, is scoped to the current user and device,
        and is not a database credential. PowerSync verifies it with
        `GET /v1/auth/jwks`.
      responses:
        "200":
          description: Credentials the official PowerSync client SDKs can present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/dev/jwks:
    get:
      operationId: getDevelopmentJwks
      summary: Development alias of the public ES256 JWKS
      security: []
      responses:
        "200":
          description: The same public JWKS as `/v1/auth/jwks`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "404":
          description: Disabled outside FOYER_SERVER_ENV=development.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/folders:
    get:
      operationId: listFolders
      summary: List the current user's live folders
      responses:
        "200":
          description: Folders in deterministic parent, position, name, id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createFolder
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: The folder was created or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/SemanticRejection"
  /v1/folders/{folderId}:
    get:
      operationId: getFolder
      summary: Fetch one live folder
      parameters:
        - $ref: "#/components/parameters/folderId"
      responses:
        "200":
          description: The folder exists and belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/folders/{folderId}/rename:
    post:
      operationId: renameFolder
      summary: Rename a folder
      parameters:
        - $ref: "#/components/parameters/folderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFolderRequest"
      responses:
        "200":
          description: The folder was renamed or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/folders/{folderId}/move:
    post:
      operationId: moveFolder
      summary: Move a folder or change its position
      parameters:
        - $ref: "#/components/parameters/folderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: The folder was moved or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/SemanticRejection"
  /v1/folders/{folderId}/delete:
    post:
      operationId: deleteFolder
      summary: Tombstone an empty folder
      parameters:
        - $ref: "#/components/parameters/folderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: The folder was tombstoned or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/SemanticRejection"
  /v1/notes:
    get:
      operationId: listNotes
      summary: List the current user's live notes
      parameters:
        - name: folderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notes in deterministic updated-at, id order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNote
      summary: Create a Markdown note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "200":
          description: The note was created or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/SemanticRejection"
  /v1/notes/{noteId}:
    get:
      operationId: getNote
      summary: Fetch one live note
      parameters:
        - $ref: "#/components/parameters/noteId"
      responses:
        "200":
          description: The note exists and belongs to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/notes/{noteId}/update:
    post:
      operationId: updateNote
      summary: Replace a note's title and Markdown body
      parameters:
        - $ref: "#/components/parameters/noteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: The note was updated or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/notes/{noteId}/move:
    post:
      operationId: moveNote
      summary: Move a note into another folder
      parameters:
        - $ref: "#/components/parameters/noteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNoteRequest"
      responses:
        "200":
          description: The note was moved or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/notes/{noteId}/delete:
    post:
      operationId: deleteNote
      summary: Tombstone a note
      parameters:
        - $ref: "#/components/parameters/noteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: The note was tombstoned or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
