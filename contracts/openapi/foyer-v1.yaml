components:
  securitySchemes:
    foyerAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Five-minute ES256 access JWT issued by POST /v1/auth/sessions. Claims
        are documented in contracts/auth/v1/.
    developmentBearer:
      type: http
      scheme: bearer
      description: >
        Development-only static token from FOYER_DEV_TOKEN. Rejected unless the
        process is running with FOYER_SERVER_ENV=development.
  parameters:
    folderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    noteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    bookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    listId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    taskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    addressBookId:
      name: addressBookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    contactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    calendarId:
      name: calendarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: The token is not usable in this process environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: The entity does not exist for this user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Stale expected revision or identifier collision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Gone:
      description: The entity is tombstoned and cannot be resurrected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    InvalidRequest:
      description: The request failed input bounds or schema validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    SemanticRejection:
      description: >
        The mutation is well-formed but violates folder emptiness, parent, cycle,
        or limit rules.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unavailable:
      description: PostgreSQL or the DAV authority is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    RateLimited:
      description: Authentication request rate or outstanding-challenge bound exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        service:
          type: string
          const: foyer-server
        version:
          type: string
    CreateAuthChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - deviceKeyId
      properties:
        deviceKeyId:
          type: string
          description: RFC 7638 SHA-256 thumbprint of the P-256 public JWK.
    AuthChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - signingPayload
        - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        signingPayload:
          type: string
          description: Opaque base64url-no-pad bytes the device must sign.
        expiresAt:
          type: string
          format: date-time
    CreateAuthSessionRequest:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - signature
      properties:
        challengeId:
          type: string
          format: uuid
        signature:
          type: string
          description: IEEE P1363 r||s, base64url without padding.
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresAt
        - userId
        - deviceKeyId
      properties:
