    post:
      operationId: createBookmarkFolder
      summary: Create a bookmark folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookmarkFolderRequest"
      responses:
        "200":
          description: The folder was created or the operation was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/SemanticRejection"
  /v1/bookmark-folders/{folderId}:
    get:
      operationId: getBookmarkFolder
      parameters:
        - $ref: "#/components/parameters/folderId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkFolder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /v1/bookmark-folders/{folderId}/rename:
    post:
      operationId: renameBookmarkFolder
